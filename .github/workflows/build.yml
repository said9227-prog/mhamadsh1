name: Build Release APK

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  # Decode the release keystore
  - name: Decode Android Keystore
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    run: |
      set -e

      if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty or missing."
        exit 1
      fi

      echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-key.jks"

      if [ ! -s "${{ github.workspace }}/release-key.jks" ]; then
        echo "ERROR: Keystore file was not created."
        exit 1
      fi

      echo "Keystore file created successfully."

  # Verify that the keystore password and alias are correct
  - name: Verify Keystore
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    run: |
      set -e

      if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
        echo "ERROR: ANDROID_KEYSTORE_PASSWORD is empty or missing."
        exit 1
      fi

      if [ -z "$ANDROID_KEY_ALIAS" ]; then
        echo "ERROR: ANDROID_KEY_ALIAS is empty or missing."
        exit 1
      fi

      keytool -list \
        -keystore "${{ github.workspace }}/release-key.jks" \
        -storetype PKCS12 \
        -storepass "$ANDROID_KEYSTORE_PASSWORD" \
        -alias "$ANDROID_KEY_ALIAS"

      echo "Keystore verification successful."

  # Build signed Release APK
  - name: Build Release APK
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    run: |
      set -e

      chmod +x ./gradlew

      ./gradlew assembleRelease \
        --stacktrace \
        --no-daemon

  # Verify APK exists
  - name: Verify Release APK
    run: |
      set -e

      APK_PATH="app/build/outputs/apk/release/app-release.apk"

      if [ ! -f "$APK_PATH" ]; then
        echo "ERROR: Release APK was not created."
        exit 1
      fi

      echo "Release APK created successfully:"
      ls -lh "$APK_PATH"

  # Upload APK for only 1 day
  - name: Upload Release APK
    uses: actions/upload-artifact@v4
    with:
      name: client-accounts-pro-release-apk
      path: app/build/outputs/apk/release/app-release.apk
      retention-days: 1
      if-no-files-found: error

  # Remove sensitive keystore from runner
  - name: Delete Keystore
    if: always()
    run: |
      rm -f "${{ github.workspace }}/release-key.jks"
