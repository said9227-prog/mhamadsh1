name: Build Release APK

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:  
  - name: Checkout source  
    uses: actions/checkout@v4  

  - name: Set up JDK 17  
    uses: actions/setup-java@v4  
    with:  
      distribution: temurin  
      java-version: '17'  

  - name: Setup Android SDK  
    uses: android-actions/setup-android@v3  

  - name: Setup Gradle  
    uses: gradle/actions/setup-gradle@v4  

  - name: Decode Android Keystore  
    env:  
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}  
    run: |  
      if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then  
        echo "Error: ANDROID_KEYSTORE_BASE64 secret is empty or missing."  
        exit 1  
      fi  

      echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-key.jks"  

      if [ ! -s "${{ github.workspace }}/release-key.jks" ]; then  
        echo "Error: Keystore file was not created."  
        exit 1  
      fi  

  - name: Build Release APK  
    env:  
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks  
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}  
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}  
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}  
    run: |  
      chmod +x ./gradlew  
      ./gradlew assembleRelease --stacktrace --no-daemon  

  - name: Verify Release APK  
    run: |  
      if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then  
        echo "Error: Release APK was not created."  
        exit 1  
      fi  

      ls -lh app/build/outputs/apk/release/app-release.apk  

  - name: Upload Release APK  
    uses: actions/upload-artifact@v4  
    with:  
      name: client-accounts-pro-release-apk  
      path: app/build/outputs/apk/release/app-release.apk  
      retention-days: 1
